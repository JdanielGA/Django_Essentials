{% extends 'base.html' %}

{% block title %}Add New Task{% endblock %}

{% block content %}
    <h1>Add New Task</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Task</button>
    </form>
    <br>
    <a href="{% url 'task_list' %}">Cancel and Return to Task List</a>
{% endblock %}
