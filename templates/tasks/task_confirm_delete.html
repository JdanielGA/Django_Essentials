{% extends 'base.html' %}

{% block title %}Confirm Delete Task{% endblock %}

{% block content %}
    <h1>Confirm Delete Task</h1>
    <p>Are you sure you want to delete the task "{{ task.title }}"?</p>
    <p>This action cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
        <a href="{% url 'task_list' %}">No, Cancel</a>
    </form>
{% endblock %}
