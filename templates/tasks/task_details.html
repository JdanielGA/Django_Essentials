<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Details</title>
</head>

<body>
    <h1>{{ task.title }}</h1>
    <p><strong>Description:</strong></p>
    <p>{{ task.description }}</p>
    <p><strong>Status:</strong>
        {% if task.completed %}
        Completed
        {% else %}
        Not Completed
        {% endif %}
    </p>
    <a href="{% url 'task_list' %}">Back to Task List</a>
</body>
</html>
